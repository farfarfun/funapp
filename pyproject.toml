[project]
name = "funapp"
version = "1.1.5"
description = "funapp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "nicegui>=2.0.0",
    "funbuild>=1.6.0",
    "farlog>=1.1.0",
    "funsecret>=1.4.0",
    "funshell>=1.0.0",
]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funapp"
Releases = "https://github.com/farfarfun/funapp/releases"

[tool.setuptools]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
]

