[project]
name = "funapp"
version = "1.1.4"
description = "funapp"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "sqlalchemy",
    "pymysql",
    "nicegui",
    "funbuild",
]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funapp"
Releases = "https://github.com/farfarfun/funapp/releases"

[tool.setuptools]
license-files = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
[[tool.uv.index]]
name = "packages-pypi"
url = "https://packages.aliyun.com/5fc5eb115dbd287006145e5f/pypi/funpy"

